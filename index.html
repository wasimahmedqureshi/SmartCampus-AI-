<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
<meta name="theme-color" content="#0f172a" />
<title>SmartCampus AI — Class 1–10 AI Learning Platform</title>

<style>
:root{
  --primary:#2563eb;--primary-light:#3b82f6;--primary-dark:#1e40af;
  --accent:#f59e0b;--success:#22c55e;--danger:#ef4444;
  --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-300:#cbd5e1;
  --gray-400:#94a3b8;--gray-500:#64748b;--gray-600:#475569;--gray-700:#334155;
  --gray-800:#1e293b;--gray-900:#0f172a;
  --radius:16px;--shadow:0 4px 24px rgba(15,23,42,.06);
  --shadow-lg:0 12px 48px rgba(15,23,42,.14);
  --transition:.25s cubic-bezier(.4,0,.2,1);
  --header-h:64px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--gray-50);color:var(--gray-800);line-height:1.55;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;background:none;font-family:inherit;font-size:inherit;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;outline:none}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:8px}
.hidden{display:none!important}
.text-center{text-align:center}.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.w-full{width:100%}.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.muted{color:var(--gray-500);font-size:14px}

#loader{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e293b);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#fff;transition:opacity .4s ease}
#loader.done{opacity:0;pointer-events:none}
#loader .brand{font-size:34px;font-weight:800;letter-spacing:-1px;margin-bottom:8px}
#loader .brand span{color:var(--accent)}
#loader .tag{font-size:14px;color:#cbd5e1;margin-bottom:24px}
.spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.app-header{position:sticky;top:0;z-index:80;height:var(--header-h);background:rgba(15,23,42,.96);backdrop-filter:blur(14px);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,3vw);gap:12px;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.4px}
.logo .icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary-dark));font-size:19px;box-shadow:0 4px 14px rgba(37,99,235,.4)}
.logo .name span{color:var(--accent)}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:#fff;font-size:17px;transition:var(--transition)}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.lang-btn{padding:7px 14px;border-radius:20px;background:rgba(255,255,255,.1);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.14);transition:var(--transition)}
.lang-btn:hover{background:rgba(255,255,255,.2)}
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:20px;background:rgba(255,255,255,.08);font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition)}
.user-chip .avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#0f172a;display:grid;place-items:center;font-weight:800;font-size:12px}

.app-main{max-width:1180px;margin:0 auto;padding:24px max(16px,3vw) 120px}
.page{display:none;animation:fadeUp .35s ease}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.hero{background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 65%,#6366f1 100%);border-radius:20px;padding:44px 36px;color:#fff;margin-bottom:28px;position:relative;overflow:hidden;box-shadow:0 16px 44px rgba(37,99,235,.28)}
.hero::before{content:'';position:absolute;top:-40%;right:-10%;width:340px;height:340px;background:radial-gradient(circle,rgba(245,158,11,.28),transparent 70%);border-radius:50%}
.hero-inner{position:relative;z-index:1;max-width:720px}
.hero .eyebrow{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.14);font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:12px;border:1px solid rgba(255,255,255,.18)}
.hero h1{font-size:clamp(24px,4vw,36px);font-weight:800;line-height:1.15;letter-spacing:-.6px}
.hero h1 span{color:var(--accent)}
.hero p{font-size:clamp(14px,1.6vw,17px);opacity:.94;margin-top:10px;max-width:600px}
.hero-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:12px;font-weight:600;font-size:14px;transition:var(--transition);cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.28)}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-accent{background:var(--accent);color:#0f172a;box-shadow:0 6px 18px rgba(245,158,11,.3)}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.24)}
.btn-ghost:hover{background:rgba(255,255,255,.24)}
.btn-secondary{background:var(--gray-100);color:var(--gray-700)}
.btn-secondary:hover{background:var(--gray-200)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:#fee2e2;color:var(--danger)}
.btn-danger:hover{background:#fecaca}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:9px}
.btn-lg{padding:14px 28px;font-size:15px;border-radius:14px}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.section-head h2{font-size:clamp(18px,2.2vw,22px);font-weight:800;letter-spacing:-.3px}
.section-head .sub{font-size:13px;color:var(--gray-500);font-weight:500}

.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.class-card{background:#fff;border-radius:var(--radius);padding:20px 16px;text-align:center;border:1px solid var(--gray-200);box-shadow:var(--shadow);cursor:pointer;transition:var(--transition)}
.class-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--primary-light)}
.class-card .grade{font-size:32px;font-weight:800;line-height:1;letter-spacing:-1px;background:linear-gradient(135deg,var(--primary),#6366f1);-webkit-background-clip:text;background-clip:text;color:transparent}
.class-card .grade-label{font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.class-card .subjects{font-size:12px;color:var(--gray-500);margin-top:10px;font-weight:500}

.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.subject-card{background:#fff;border-radius:var(--radius);padding:22px 16px;text-align:center;border:1px solid var(--gray-200);box-shadow:var(--shadow);cursor:pointer;transition:var(--transition)}
.subject-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--primary-light)}
.subject-card .icon{font-size:40px;margin-bottom:8px;display:block}
.subject-card .name{font-size:15px;font-weight:700;line-height:1.25}
.subject-card .count{font-size:12px;color:var(--gray-500);margin-top:4px}

.chapter-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.chapter-card{background:#fff;border-radius:var(--radius);padding:18px 20px;border:1px solid var(--gray-200);box-shadow:var(--shadow);cursor:pointer;transition:var(--transition);display:flex;flex-direction:column;min-height:150px}
.chapter-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--primary-light)}
.chapter-card .tag{align-self:flex-start;font-size:11px;font-weight:700;color:var(--primary);background:#eef4ff;padding:2px 10px;border-radius:12px;letter-spacing:.3px;text-transform:uppercase}
.chapter-card h3{font-size:16px;font-weight:700;margin-top:8px;line-height:1.3}
.chapter-card .desc{font-size:13px;color:var(--gray-500);margin-top:4px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chapter-card .meta{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--gray-500)}
.chapter-card .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--gray-300)}

.chapter-view{background:#fff;border-radius:var(--radius);border:1px solid var(--gray-200);box-shadow:var(--shadow);overflow:hidden}
.ch-header{padding:20px 26px 16px;background:linear-gradient(180deg,var(--gray-50),#fff);border-bottom:1px solid var(--gray-200)}
.ch-header .crumb{font-size:12px;color:var(--gray-500);font-weight:600;cursor:pointer;margin-bottom:6px}
.ch-header h2{font-size:clamp(19px,2.4vw,24px);font-weight:800;letter-spacing:-.3px}
.ch-header .subtitle{font-size:14px;color:var(--gray-500);margin-top:4px}
.ch-tabs{display:flex;gap:2px;padding:0 16px;background:#fff;border-bottom:1px solid var(--gray-200);overflow-x:auto;scrollbar-width:none}
.ch-tabs::-webkit-scrollbar{display:none}
.ch-tabs button{padding:14px 18px;font-size:14px;font-weight:600;color:var(--gray-500);border-bottom:3px solid transparent;white-space:nowrap;transition:var(--transition)}
.ch-tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
.ch-body{padding:26px}
.tab-pane{display:none;animation:fadeUp .28s ease}
.tab-pane.active{display:block}

.content-block h1,.content-block h2,.content-block h3,.content-block h4{color:var(--gray-900);margin:14px 0 8px;line-height:1.3}
.content-block h2{font-size:20px}.content-block h3{font-size:17px}
.content-block p{font-size:15px;color:var(--gray-700);margin-bottom:10px;line-height:1.7}
.content-block ul,.content-block ol{padding-left:22px;margin-bottom:12px}
.content-block li{font-size:15px;color:var(--gray-700);margin-bottom:4px;line-height:1.65}
.highlight-box{background:#eff6ff;border-left:4px solid var(--primary);padding:14px 18px;border-radius:0 12px 12px 0;margin:14px 0;font-size:14px}
.tip-list{background:#fffbeb;border-left:4px solid var(--accent);padding:14px 18px;border-radius:0 12px 12px 0;margin:14px 0;font-size:14px}
.content-block table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
.content-block th,.content-block td{border:1px solid var(--gray-200);padding:9px 12px;text-align:left}
.content-block th{background:var(--gray-50);font-weight:700}

.score-banner{background:linear-gradient(135deg,var(--gray-900),var(--gray-800));color:#fff;border-radius:14px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.score-banner .label{font-size:13px;opacity:.7;font-weight:500}
.score-banner .value{font-size:26px;font-weight:800;color:var(--accent)}
.question-item{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.question-item .q-text{font-weight:600;font-size:15px;margin-bottom:12px;line-height:1.5}
.options{display:flex;flex-direction:column;gap:6px}
.options label{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:#fff;border:1px solid var(--gray-200);font-size:14px;cursor:pointer;transition:var(--transition)}
.options label:hover{background:#eff6ff;border-color:var(--primary-light)}
.options input[type="radio"]{accent-color:var(--primary);width:16px;height:16px;cursor:pointer}
.feedback{margin-top:10px;font-size:14px;font-weight:600;padding:8px 12px;border-radius:9px;display:inline-block}
.feedback.correct{background:#dcfce7;color:#15803d}
.feedback.wrong{background:#fee2e2;color:#b91c1c}
.fill-item{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.fill-item .q-text{font-size:14px;margin-bottom:8px}
.fill-item input{width:100%;max-width:280px;padding:9px 14px;border:1px solid var(--gray-300);border-radius:9px;font-size:14px;background:#fff}
.fill-item input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.qa-item{background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:14px 18px;margin-bottom:10px}
.qa-item .q{font-weight:600;font-size:15px;color:var(--gray-900);margin-bottom:8px}
.qa-item .a{font-size:14px;color:var(--gray-700);padding-left:14px;border-left:3px solid var(--primary);line-height:1.65}

.admin-shell{background:#fff;border-radius:var(--radius);border:1px solid var(--gray-200);box-shadow:var(--shadow);overflow:hidden}
.admin-topbar{padding:16px 22px;background:linear-gradient(180deg,var(--gray-50),#fff);border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.admin-topbar h2{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.admin-nav{display:flex;gap:4px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--gray-200);overflow-x:auto;scrollbar-width:none}
.admin-nav::-webkit-scrollbar{display:none}
.admin-nav button{padding:8px 14px;font-size:13px;font-weight:600;color:var(--gray-500);border-radius:9px;white-space:nowrap;transition:var(--transition)}
.admin-nav button:hover{color:var(--gray-800);background:var(--gray-100)}
.admin-nav button.active{background:var(--primary);color:#fff}
.admin-content{padding:22px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-weight:600;font-size:13px;margin-bottom:5px;color:var(--gray-700)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 14px;border:1px solid var(--gray-300);border-radius:10px;font-size:14px;background:#fff;transition:var(--transition)}
.form-group textarea{min-height:110px;resize:vertical;font-family:'SF Mono',Consolas,monospace;font-size:13px;line-height:1.55}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 14px;border-radius:20px;background:var(--gray-100);color:var(--gray-600);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition)}
.chip.active{background:var(--primary);color:#fff}
.item-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:12px;margin-bottom:8px;flex-wrap:wrap}
.item-row .info{flex:1;min-width:180px}
.item-row .info .title{font-weight:600;font-size:14px}
.item-row .info .sub{font-size:12px;color:var(--gray-500)}
.item-row .actions{display:flex;gap:6px}
.pdf-viewer{width:100%;height:70vh;border:1px solid var(--gray-200);border-radius:12px;background:var(--gray-100)}

.empty{text-align:center;padding:56px 24px;color:var(--gray-500);background:#fff;border:2px dashed var(--gray-200);border-radius:16px}
.empty .icon{font-size:52px;display:block;margin-bottom:10px;opacity:.6}
.empty h3{font-size:16px;font-weight:700;color:var(--gray-700);margin-bottom:4px}
.empty p{font-size:13px;max-width:340px;margin:0 auto}

#toastWrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9000;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 32px);max-width:380px}
.toast{padding:13px 18px;border-radius:12px;background:var(--gray-900);color:#fff;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;pointer-events:all;animation:toastIn .3s ease}
.toast.success{background:#15803d}.toast.error{background:#b91c1c}.toast.info{background:#1e40af}
.toast .close{margin-left:auto;opacity:.6;font-size:18px;line-height:1}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.fab{position:fixed;bottom:calc(20px + var(--safe-bottom));right:20px;z-index:70;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#6366f1);color:#fff;font-size:26px;display:grid;place-items:center;box-shadow:0 8px 26px rgba(37,99,235,.4);transition:var(--transition)}
.fab:hover{transform:scale(1.06)}
.chat-panel{position:fixed;bottom:calc(88px + var(--safe-bottom));right:20px;z-index:70;width:min(370px,calc(100vw - 40px));height:min(540px,70vh);background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);border:1px solid var(--gray-200);display:flex;flex-direction:column;overflow:hidden;animation:popIn .25s ease}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.chat-head{padding:14px 18px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.chat-head .status{font-size:11px;opacity:.85;font-weight:500}
.chat-body{flex:1;overflow-y:auto;padding:16px;background:var(--gray-50);display:flex;flex-direction:column;gap:10px}
.chat-msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.55;word-wrap:break-word;white-space:pre-wrap}
.chat-msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.chat-msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--gray-200);border-bottom-left-radius:4px}
.chat-msg.typing{color:var(--gray-500);font-style:italic}
.chat-input{padding:12px;border-top:1px solid var(--gray-200);display:flex;gap:8px;background:#fff}
.chat-input input{flex:1;padding:10px 14px;border:1px solid var(--gray-300);border-radius:20px;font-size:14px}
.chat-input input:focus{border-color:var(--primary)}
.chat-input button{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:16px}

@media (max-width:640px){
  .app-main{padding:16px 14px 120px}
  .hero{padding:26px 22px;border-radius:16px}
  .hero-actions .btn{flex:1}
  .class-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .class-card{padding:16px 10px}
  .class-card .grade{font-size:26px}
  .subject-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .subject-card{padding:16px 10px}
  .subject-card .icon{font-size:32px}
  .chapter-list{grid-template-columns:1fr}
  .ch-header{padding:16px 18px 12px}
  .ch-body{padding:18px 16px}
  .form-row{grid-template-columns:1fr}
  .admin-content{padding:16px}
  .logo .name{display:none}
  .chat-panel{width:calc(100vw - 24px);right:12px;bottom:calc(80px + var(--safe-bottom))}
  .fab{right:14px;bottom:calc(14px + var(--safe-bottom));width:52px;height:52px;font-size:23px}
}
</style>
</head>
<body>

<div id="loader">
  <div class="brand">SmartCampus <span>AI</span></div>
  <div class="tag">Class 1–10 AI Learning Platform</div>
  <div class="spinner"></div>
</div>

<header class="app-header">
  <div class="logo" id="brandLogo">
    <div class="icon" id="brandIcon">🎓</div>
    <div class="name" id="brandName">SmartCampus <span>AI</span></div>
  </div>
  <div class="header-actions">
    <button class="lang-btn" id="langBtn">🌐 EN</button>
    <button class="icon-btn" id="adminBtn" title="Admin">⚙️</button>
    <button class="user-chip hidden" id="userChip">
      <div class="avatar" id="userAvatar">?</div>
      <span id="userName">User</span>
    </button>
    <button class="icon-btn hidden" id="logoutBtn" title="Logout">↩</button>
  </div>
</header>

<main class="app-main">
  <section class="page" id="page-auth"></section>
  <section class="page" id="page-home"></section>
  <section class="page" id="page-subjects"></section>
  <section class="page" id="page-chapters"></section>
  <section class="page" id="page-chapter"></section>
  <section class="page" id="page-dashboard"></section>
  <section class="page" id="page-admin"></section>
</main>

<button class="fab" id="chatFab" title="Ask SmartCampus AI">🤖</button>
<div class="chat-panel hidden" id="chatPanel">
  <div class="chat-head">
    <div>
      <div>🤖 SmartCampus AI</div>
      <div class="status" id="chatStatus">Ask about your chapter...</div>
    </div>

/* ======================= DATA SERVICE ======================= */
const DataService = {
  async getClasses(){
    const snap = await getDocs(query(collection(db,'classes'), orderBy('order')));
    return snap.docs.map(d=>({id:d.id, ...d.data()}));
  },
  async getSubjects(classId){
    if(State.subjectsCache[classId]) return State.subjectsCache[classId];
    const snap = await getDocs(query(
      collection(db,'subjects'),
      where('classId','==',classId),
      where('active','==',true),
      orderBy('order')
    ));
    const list = snap.docs.map(d=>({id:d.id, ...d.data()}));
    State.subjectsCache[classId] = list;
    return list;
  },
  async getChapters(subjectId){
    if(State.chaptersCache[subjectId]) return State.chaptersCache[subjectId];
    const snap = await getDocs(query(
      collection(db,'chapters'),
      where('subjectId','==',subjectId),
      orderBy('order')
    ));
    const list = snap.docs.map(d=>({id:d.id, ...d.data()}));
    State.chaptersCache[subjectId] = list;
    return list;
  },
  async getQuestions(chapterId){
    if(State.questionsCache[chapterId]) return State.questionsCache[chapterId];
    const snap = await getDocs(query(collection(db,'questions'), where('chapterId','==',chapterId)));
    const grouped = { mcq:[], fill:[], qa:[] };
    snap.docs.forEach(d=>{
      const q = {id:d.id, ...d.data()};
      (grouped[q.type] || (grouped[q.type]=[])).push(q);
    });
    Object.keys(grouped).forEach(k=> grouped[k].sort((a,b)=>(a.order||0)-(b.order||0)));
    State.questionsCache[chapterId] = grouped;
    return grouped;
  },
  clearCache(){ State.subjectsCache={}; State.chaptersCache={}; State.questionsCache={}; },
  async seedDefaults(){
    const exist = await getDocs(query(collection(db,'classes'), limit(1)));
    if(!exist.empty) return false;
    const batch = writeBatch(db);
    CLASSES_SEED.forEach(c=> batch.set(doc(db,'classes',c.id), c));

      uid: cred.user.uid, name, email, classId: classId||null,
      role:'student', lang: State.lang, createdAt: serverTimestamp()

/* ======================= AI SERVICE (Direct Gemini API) ======================= */
const AIService = {
  async loadKey(){
    try{
      const snap = await getDoc(doc(db,'settings','ai'));
      State.geminiKey = snap.exists() ? (snap.data().geminiKey || null) : null;
    }catch(e){ State.geminiKey = null; }
    return State.geminiKey;
  },
  async saveKey(key){
    await setDoc(doc(db,'settings','ai'), { geminiKey: key, updatedAt: serverTimestamp() }, {merge:true});
    State.geminiKey = key;
  },
  async callGemini(prompt, systemInstruction){
    const key = State.geminiKey;
    if(!key) throw new Error(t('aiKeyMissing'));
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${key}`;
    const body = {
      contents: [{ role:'user', parts:[{ text: prompt }] }],
      ...(systemInstruction ? { systemInstruction: { parts: [{ text: systemInstruction }] } } : {})
    };
    const r = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    if(!r.ok){
      const txt = await r.text();
      console.error('Gemini error', r.status, txt);
      if(r.status === 400) throw new Error('Invalid AI key or request.');
      if(r.status === 403) throw new Error('AI key rejected. Check API permissions.');
      if(r.status === 429) throw new Error('AI rate limit. Try again in a minute.');
      throw new Error('AI service unavailable ('+r.status+')');
    }
    const data = await r.json();
    return data.candidates?.[0]?.content?.parts?.map(p=>p.text).join('') || '';
  },
  async ask({prompt, chapterContext, classLevel, lang}){
    const sys = `You are SmartCampus AI, a friendly tutor for Class ${classLevel||'5'} students in India.
- Answer at the student's level with simple language.
- Preferred language: ${lang==='hi' ? 'Hindi (Devanagari)' : 'English'}.
- If a chapter context is provided, base your answer primarily on it. Do not invent unrelated textbook content.
- Use short paragraphs, bullet points where helpful. No markdown code fences.
- Keep answers under 250 words unless the student asks for more detail.`;
    const userPrompt = chapterContext
      ? `Chapter content:\n"""\n${String(chapterContext).slice(0,8000)}\n"""\n\nStudent asks: ${prompt}`
      : `Student asks: ${prompt}`;
    return this.callGemini(userPrompt, sys);
  },
  async generate({pdfText, chapterTitle, subjectName, options}){
    const mcqCount = Math.min(30, parseInt(options.mcqCount)||7);
    const fillCount = Math.min(30, parseInt(options.fillCount)||7);
    const qaCount = Math.min(30, parseInt(options.qaCount)||7);
    const sys = `You are an expert curriculum writer for Class 1–10 (NCERT-style) education in India.
Generate age-appropriate bilingual content strictly based on the provided PDF text.
Return STRICT JSON only — no commentary, no markdown fences — matching this schema:
{
  "explanation": "<HTML string suitable for chapter Learn tab>",
  "mcqs": [{ "q":"", "qHi":"", "opts":["","","",""], "optsHi":["","","",""], "ans":0, "explanation":"", "explanationHi":"" }],
  "fills":[ { "q":"", "qHi":"", "ans":"", "hint":"", "hintHi":"" } ],
  "qas":  [ { "q":"", "qHi":"", "a":"", "aHi":"" } ]
}
Rules:
- Use ONLY information present in the source PDF. Do not invent unrelated content.
- Every text field must have both English AND Hindi versions.
- MCQ must have exactly 4 options, "ans" is 0-indexed correct option.
- Fill-in-blank should contain "______" as the blank marker.`;
    const user = `Subject: ${subjectName}
Chapter: ${chapterTitle}
Source PDF text (first 15000 chars):
"""
${String(pdfText).slice(0,15000)}
"""

Generate:
- explanation: rich HTML (headings, paragraphs, highlight boxes, tables where useful)
- ${mcqCount} MCQs
- ${fillCount} Fill-in-the-Blanks
- ${qaCount} Q&A
Return ONLY valid JSON.`;
    const raw = await this.callGemini(user, sys);
    const cleaned = raw.replace(/^```json\s*/i,'').replace(/```$/,'').trim();
    let parsed;
    try{ parsed = JSON.parse(cleaned); }
    catch(e){ console.error('AI non-JSON:', raw); throw new Error('AI returned invalid content.'); }
    return {
      explanation: parsed.explanation || '',
      mcqs:  parsed.mcqs  || [],
      fills: parsed.fills || [],
      qas:   parsed.qas   || []
    };
  }
};

/* ======================= STORAGE ======================= */
const StorageService = {
  async uploadPDF(file, {classId, subjectId, chapterId, onProgress}){
    if(!file) throw new Error('No file selected');
    if(file.type !== 'application/pdf') throw new Error('Only PDF files allowed');
    if(file.size > 25*1024*1024) throw new Error('PDF must be under 25 MB');
    const path = `chapters/${classId}/${subjectId}/${chapterId}/${Date.now()}_${file.name}`;
    const r = sRef(storage, path);
    const task = uploadBytesResumable(r, file, {contentType:'application/pdf'});
    return new Promise((resolve,reject)=>{
      task.on('state_changed',
        s => onProgress && onProgress(Math.round((s.bytesTransferred/s.totalBytes)*100)),
        reject,
        async ()=>{ const url = await getDownloadURL(task.snapshot.ref); resolve({url, path}); }
      );
    });
  }
};

function renderPractice(ch, qs){
  const mcqs = qs.mcq || [], fills = qs.fill || [];
  if(!mcqs.length && !fills.length){
    return `<div class="empty"><div class="icon">📝</div><h3>No practice questions yet</h3><p>Ask admin to add questions.</p></div>`;
  }
  let html = `<div class="score-banner"><span class="label">📊 ${t('practice')}</span><span class="value" id="pracScore">0%</span></div>`;
  if(mcqs.length){
    html += `<h4 style="margin-bottom:12px">📝 MCQ</h4>`;
    html += mcqs.map((q,i)=>`
      <div class="question-item" data-mcq="${i}">
        <div class="q-text">${i+1}. ${esc(State.lang==='hi'?(q.qHi||q.q):q.q)}</div>
        <div class="options">
          ${(State.lang==='hi'? (q.optsHi||q.opts): q.opts).map((o,oi)=>`
            <label><input type="radio" name="m${i}" value="${oi}" data-idx="${i}"> ${esc(o)}</label>
          `).join('')}
        </div>
        <div class="fb-slot" data-fb="${i}"></div>
      </div>`).join('');
  }
  if(fills.length){
    html += `<h4 style="margin:20px 0 12px">✍️ Fill in the Blanks</h4>`;
    html += fills.map((q,i)=>`
      <div class="fill-item" data-fill="${i}">
        <div class="q-text">${esc(State.lang==='hi'?(q.qHi||q.q):q.q)}</div>
        <input type="text" data-fidx="${i}" placeholder="Type answer..." />
        <div class="fb-slot" data-ffb="${i}"></div>
      </div>`).join('');
  }
  html += `<div class="flex gap-12 mt-24" style="flex-wrap:wrap">
    <button class="btn btn-primary" id="checkBtn">✅ ${t('checkAnswers')}</button>
    <button class="btn btn-secondary" id="resetBtn">🔄 ${t('reset')}</button>
  </div>`;
  return html;
}
function wirePractice(ch, qs){
  const mcqs = qs.mcq || [], fills = qs.fill || [];
  const body = $('#chBody');
  const update = ()=>{
    let correct = 0, total = mcqs.length + fills.length;
    mcqs.forEach((q,i)=>{
      const sel = body.querySelector(`input[name="m${i}"]:checked`);
      if(sel && parseInt(sel.value)===q.ans) correct++;
    });
    fills.forEach((q,i)=>{
      const inp = body.querySelector(`input[data-fidx="${i}"]`);
      if(inp && inp.value.trim().toLowerCase() === String(q.ans||'').trim().toLowerCase()) correct++;
    });
    $('#pracScore').textContent = total ? Math.round((correct/total)*100)+'%' : '0%';
  };
  mcqs.forEach((q,i)=>{
    body.querySelectorAll(`input[name="m${i}"]`).forEach(el=>{
      el.onchange = ()=>{
        const sel = parseInt(el.value), correct = sel === q.ans;
        const fb = body.querySelector(`.question-item[data-mcq="${i}"] .fb-slot`);
        fb.className = `fb-slot feedback ${correct?'correct':'wrong'}`;
        fb.textContent = correct ? '✅ '+t('correct') : '❌ '+t('wrong');
        update();
      };
    });
  });
  fills.forEach((q,i)=>{
    const inp = body.querySelector(`input[data-fidx="${i}"]`);
    inp.oninput = ()=>{
      const correct = inp.value.trim().toLowerCase() === String(q.ans||'').trim().toLowerCase();
      const fb = body.querySelector(`.fill-item[data-fill="${i}"] .fb-slot`);
      if(!inp.value.trim()){ fb.textContent=''; fb.className='fb-slot'; }
      else { fb.className = `fb-slot feedback ${correct?'correct':'wrong'}`; fb.textContent = correct ? '✅ '+t('correct') : '❌ '+t('wrong'); }
      update();
    };
  });
  $('#checkBtn').onclick = ()=>{ update(); toast('✅ '+t('checkAnswers'),'success'); };
  $('#resetBtn').onclick = ()=>{
    body.querySelectorAll('input[type="radio"]').forEach(el=>el.checked=false);
    body.querySelectorAll('input[type="text"]').forEach(el=>el.value='');
    body.querySelectorAll('.fb-slot').forEach(el=>{el.textContent='';el.className='fb-slot';});
    update(); toast('🔄 '+t('reset'),'info');
  };
}

function renderQuiz(ch, qs){
  const mcqs = qs.mcq || [];
  if(!mcqs.length){
    return `<div class="empty"><div class="icon">🎯</div><h3>No quiz questions yet</h3><p>Add MCQs to enable the quiz.</p></div>`;
  }
  const pool = shuffle(mcqs).slice(0, Math.min(10, mcqs.length));
  return `
    <div class="score-banner"><span class="label">🎯 ${t('quiz')}</span><span class="value" id="quizScore">0 / ${pool.length}</span></div>
    <div id="quizBody"></div>
    <div class="flex gap-12 mt-24" style="flex-wrap:wrap">
      <button class="btn btn-success" id="quizNext" disabled>${t('next')} →</button>
      <button class="btn btn-secondary" id="quizRestart">🔄 ${t('restart')}</button>
    </div>`;
}
function wireQuiz(ch, qs){
  const mcqs = qs.mcq || [];
  const pool = shuffle(mcqs).slice(0, Math.min(10, mcqs.length));
  let idx = 0, score = 0, answered = false;
  const body = $('#quizBody');

  function draw(){
    if(idx >= pool.length){ finish(); return; }
    const q = pool[idx];
    answered = false;
    $('#quizNext').disabled = true;
    body.innerHTML = `
      <div class="question-item">
        <div class="q-text">${idx+1}. ${esc(State.lang==='hi'?(q.qHi||q.q):q.q)}</div>
        <div class="options">
          ${(State.lang==='hi'?(q.optsHi||q.opts):q.opts).map((o,oi)=>`
            <label><input type="radio" name="quiz" value="${oi}"> ${esc(o)}</label>
          `).join('')}
        </div>
        <div class="fb-slot" id="qFb"></div>
      </div>`;
    body.querySelectorAll('input[name="quiz"]').forEach(el=>{
      el.onchange = ()=>{
        if(answered) return;
        answered = true;
        const sel = parseInt(el.value), correct = sel===q.ans;
        if(correct) score++;
        const fb = $('#qFb');
        fb.className = `fb-slot feedback ${correct?'correct':'wrong'}`;
        fb.textContent = correct ? '✅ '+t('correct') : `❌ ${t('wrong')} — ${esc((State.lang==='hi'?(q.optsHi||q.opts):q.opts)[q.ans])}`;
        body.querySelectorAll('input[name="quiz"]').forEach(r=>r.disabled=true);
        $('#quizScore').textContent = `${score} / ${pool.length}`;
        $('#quizNext').disabled = false;
      };
    });
  }
  async function finish(){
    const total = pool.length;
    const percent = Math.round((score/total)*100);
    body.innerHTML = `
      <div class="empty" style="border-style:solid;border-color:var(--primary-light);">
        <div class="icon">🎉</div>
        <h3 style="font-size:20px;color:var(--primary)">${t('quizComplete')}</h3>
        <p style="font-size:16px;margin:8px 0">${t('yourScore')}: <strong>${score} / ${total}</strong></p>
        <p style="font-size:22px;font-weight:800;color:var(--accent)">${percent}%</p>
        <button class="btn btn-primary mt-16" id="goDash">${t('viewDashboard')}</button>
      </div>`;
    $('#goDash').onclick = ()=> renderDashboard();
    $('#quizNext').disabled = true;
    try{
      if(State.user){
        await addDoc(collection(db,'quizResults'), {
          studentId: State.user.uid, studentName: State.profile?.name || '',
          classId: State.currentClass.id, subjectId: State.currentSubject.id,
          chapterId: State.currentChapter.id,
          score, total, percentage: percent,
          completedAt: serverTimestamp()
        });
        await addDoc(collection(db,'progress'), {
          studentId: State.user.uid, classId: State.currentClass.id,
          subjectId: State.currentSubject.id, chapterId: State.currentChapter.id,
          activityType:'quiz', score, totalQuestions: total,
          percentage: percent, timestamp: serverTimestamp()
        });
      }
    }catch(e){ console.warn('progress save failed', e); }
  }
  $('#quizNext').onclick = ()=>{ idx++; draw(); };
  $('#quizRestart').onclick = ()=> renderChapter();
  draw();
}

async function renderDashboard(){
  const page = $('#page-dashboard');
  const name = State.profile?.name || 'Student';

  const cls = (State.classes.find(c=>c.id===clsId)) || {name:'Class', nameHi:'कक्षा'};
  page.innerHTML = `
    <div class="hero" style="padding:28px 26px">
      <div class="hero-inner">
        <div class="eyebrow">📊 ${t('dashboard')}</div>
        <h1>Hi <span>${esc(name.split(' ')[0])}</span> 👋</h1>
        <p>${esc(State.lang==='hi'?cls.nameHi:cls.name)}</p>
        <div class="hero-actions">
          <button class="btn btn-accent" id="continueBtn">${t('continue')} →</button>
          <button class="btn btn-ghost" id="homeBtn">🏠 ${t('home')}</button>
        </div>
      </div>
    </div>
    <div id="dashBody"><div class="empty"><div class="icon">⏳</div><p>${t('loading')}</p></div></div>`;
  $('#continueBtn').onclick = ()=>{ State.currentClass = State.classes.find(c=>c.id===clsId)||State.classes[0]; renderSubjects(); };
  $('#homeBtn').onclick = ()=> renderHome();
  setActive('dashboard');
  try{
    if(!State.user){ $('#dashBody').innerHTML = ''; return; }
    const snap = await getDocs(query(
      collection(db,'progress'),
      where('studentId','==',State.user.uid),
      orderBy('timestamp','desc'),
      limit(100)
    ));
    const items = snap.docs.map(d=>({id:d.id, ...d.data()}));
    const bySubject = {};
    items.forEach(it=>{
      if(!bySubject[it.subjectId]) bySubject[it.subjectId] = {scores:[], count:0};
      bySubject[it.subjectId].scores.push(it.percentage||0);
      bySubject[it.subjectId].count++;
    });
    const subNames = {};
    try{
      const subs = await DataService.getSubjects(clsId);
      subs.forEach(s=> subNames[s.id] = State.lang==='hi'?(s.nameHi||s.name):s.name);
    }catch(e){}
    const rows = Object.entries(bySubject).map(([sid, agg])=>{
      const avg = Math.round(agg.scores.reduce((a,b)=>a+b,0) / agg.scores.length);
      return {name: subNames[sid]||sid, avg, count: agg.count};
    }).sort((a,b)=>b.avg-a.avg);
    const recent = items.slice(0,6);
    $('#dashBody').innerHTML = `
      <div class="section-head"><h2>📈 ${t('progress')}</h2></div>
      ${rows.length ? rows.map(r=>`
        <div style="background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:14px 18px;margin-bottom:10px">
          <div class="flex justify-between items-center" style="margin-bottom:6px">
            <strong style="font-size:14px">${esc(r.name)}</strong>
            <span style="font-weight:800;color:var(--primary)">${r.avg}%</span>
          </div>
          <div style="height:8px;background:var(--gray-100);border-radius:8px;overflow:hidden">
            <div style="height:100%;width:${r.avg}%;background:linear-gradient(90deg,var(--primary),#6366f1)"></div>
          </div>
          <div class="muted mt-8" style="font-size:12px">${r.count} activities</div>
        </div>`).join('') : `<div class="empty"><div class="icon">📊</div><h3>No activity yet</h3><p>Start learning and your progress will show here.</p></div>`}
      ${recent.length ? `
        <div class="section-head mt-24"><h2>🕒 ${t('recentActivity')}</h2></div>
        ${recent.map(it=>`
          <div class="item-row">
            <div class="info">
              <div class="title">${esc(it.activityType||'activity')} · ${it.percentage||0}%</div>
              <div class="sub">${it.score||0}/${it.totalQuestions||0} · ${it.classId||''}</div>
            </div>
          </div>`).join('')}
      ` : ''}`;
  }catch(e){
    console.error(e);
    $('#dashBody').innerHTML = `<div class="empty"><div class="icon">⚠️</div><h3>Could not load progress</h3><p>${esc(e.message)}</p></div>`;
  }
}

function renderAdminTab(tab){
  const c = $('#adminContent');
  if(tab==='chapters')  return renderAdminChapters(c);
  if(tab==='subjects')  return renderAdminSubjects(c);
  if(tab==='classes')   return renderAdminClasses(c);
  if(tab==='pdf')       return renderAdminPDF(c);
  if(tab==='questions') return renderAdminQuestions(c);
  if(tab==='aigen')     return renderAdminAIGen(c);
  if(tab==='students')  return renderAdminStudents(c);
  if(tab==='results')   return renderAdminResults(c);
  if(tab==='settings')  return renderAdminSettings(c);
}

    </div>

    <div class="form-group"><label>Content (Hindi HTML) — optional</label><textarea id="chContentHi" rows="6">${esc(chapter?.contentHi||'')}</textarea></div>
    <div class="flex gap-12 mt-16" style="flex-wrap:wrap">
      <button class="btn btn-primary" id="saveCh">💾 ${t('save')}</button>

  $('#saveCh').onclick = async ()=>{
    const data = {
      classId, subjectId,
      number: parseInt($('#chNum').value)||1,
      order:  parseInt($('#chOrder').value)||1,
      title:   $('#chTitle').value.trim(),
      titleHi: $('#chTitleHi').value.trim() || $('#chTitle').value.trim(),
      summary: $('#chSum').value.trim(),
      summaryHi: $('#chSumHi').value.trim() || $('#chSum').value.trim(),
      content: $('#chContent').value,
      contentHi: $('#chContentHi').value,

    };

      renderAdminTab('chapters');

async function renderAdminQuestions(c){
  c.innerHTML = `
    <h3 style="font-size:16px;font-weight:800;margin-bottom:14px">❓ Question Bank</h3>
    <div class="form-row">
      <div class="form-group"><label>Class</label><select id="qbClass"></select></div>

    </div>
    <div class="form-group"><label>Chapter</label><select id="qbChapter"></select></div>
    <div class="chip-row">
      <div class="chip active" data-type="all">All</div>
      <div class="chip" data-type="mcq">MCQ</div>
      <div class="chip" data-type="fill">Fill</div>
      <div class="chip" data-type="qa">Q&A</div>
    </div>
    <div id="qbList"></div>`;
  const classList = State.classes.length ? State.classes : CLASSES_SEED;
  $('#qbClass').innerHTML = classList.map(x=>`<option value="${x.id}">${esc(State.lang==='hi'?x.nameHi:x.name)}</option>`).join('');
  $('#qbClass').value = 'class-5';
  let typeFilter = 'all';
  async function loadSubs(){
    const subs = await DataService.getSubjects($('#qbClass').value);
    $('#qbSubject').innerHTML = subs.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
    await loadChapters();
  }
  async function loadChapters(){
    const subId = $('#qbSubject').value;
    if(!subId){ $('#qbChapter').innerHTML = ''; return; }
    delete State.chaptersCache[subId];
    const chapters = await DataService.getChapters(subId);
    $('#qbChapter').innerHTML = chapters.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');
    await loadQuestions();
  }
  async function loadQuestions(){
    const chId = $('#qbChapter').value;
    if(!chId){ $('#qbList').innerHTML = `<div class="empty"><div class="icon">❓</div><p>Select chapter</p></div>`; return; }
    delete State.questionsCache[chId];
    const qs = await DataService.getQuestions(chId);
    const list = [];
    ['mcq','fill','qa'].forEach(k=>{
      if(typeFilter==='all' || typeFilter===k) list.push(...qs[k].map(q=>({...q, _type:k})));
    });
    $('#qbList').innerHTML = list.length ? list.map(q=>`
      <div class="item-row">
        <div class="info">
          <div class="title">[${q._type.toUpperCase()}] ${esc(q.q||q.qHi||'')}</div>
          <div class="sub">${q._type==='mcq'? `Answer: ${esc((q.opts||[])[q.ans]||'')}` : q._type==='fill' ? `Answer: ${esc(q.ans||'')}` : esc((q.a||'').slice(0,80))}</div>
        </div>
        <div class="actions">
          <button class="btn btn-danger btn-sm delQ" data-id="${q.id}">🗑️</button>
        </div>
      </div>`).join('') : `<div class="empty"><div class="icon">📝</div><p>No questions</p></div>`;
    $$('#qbList .delQ').forEach(b=> b.onclick = async ()=>{
      if(!confirm('Delete question?')) return;
      await deleteDoc(doc(db,'questions',b.dataset.id));
      toast('Deleted','success'); DataService.clearCache(); loadQuestions();
    });
  }
  $$('#adminContent .chip').forEach(chip=> chip.onclick = ()=>{
    $$('#adminContent .chip').forEach(x=>x.classList.remove('active'));
    chip.classList.add('active');
    typeFilter = chip.dataset.type;
    loadQuestions();
  });
  $('#qbClass').onchange = loadSubs;
  $('#qbSubject').onchange = loadChapters;
  $('#qbChapter').onchange = loadQuestions;
  await loadSubs();
}

async function extractPdfText(file){
  if(!window.pdfjsLib){
    await new Promise((res,rej)=>{
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = res; s.onerror = rej; document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  let out = '';
  for(let i=1;i<=Math.min(pdf.numPages,40);i++){
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    out += tc.items.map(x=>x.str).join(' ') + '\n';
  }
  return out;
}

/* ======================= CHATBOT ======================= */
function wireChat(){
  const fab = $('#chatFab');
  const panel = $('#chatPanel');
  const body = $('#chatBody');
  const input = $('#chatInput');
  const send = $('#chatSend');
  fab.onclick = ()=> panel.classList.toggle('hidden');
  $('#chatClose').onclick = ()=> panel.classList.add('hidden');
  async function push(text){
    if(!text.trim()) return;
    if(!State.geminiKey){ toast(t('aiKeyMissing'),'error'); return; }
    const userMsg = document.createElement('div');
    userMsg.className = 'chat-msg user'; userMsg.textContent = text;
    body.appendChild(userMsg);
    input.value = '';
    body.scrollTop = body.scrollHeight;
    const typing = document.createElement('div');
    typing.className = 'chat-msg ai typing'; typing.textContent = '🤖 Thinking…';
    body.appendChild(typing);
    body.scrollTop = body.scrollHeight;
    try{
      const answer = await AIService.ask({
        prompt: text,
        chapterContext: State.chatContext?.chapterContent || '',
        classLevel: State.chatContext?.classId || State.profile?.classId,
        lang: State.lang
      });
      typing.classList.remove('typing');
      typing.textContent = answer;
    }catch(e){
      typing.classList.remove('typing');
      typing.textContent = '⚠️ '+e.message;
    }
    body.scrollTop = body.scrollHeight;
  }
  send.onclick = ()=> push(input.value);
  input.onkeydown = e=>{ if(e.key==='Enter') push(input.value); };
}

  $('#langBtn').onclick = ()=>{

  };

  $('#logoutBtn').onclick = async ()=>{ await AuthService.logout(); location.reload(); };

function updateUserChip(){
  const chip = $('#userChip');
  const nm = $('#userName');
  const av = $('#userAvatar');
  if(State.profile?.name){
    chip.classList.remove('hidden');
    $('#logoutBtn').classList.remove('hidden');
    nm.textContent = State.profile.name.split(' ')[0];
    av.textContent = initials(State.profile.name);
  } else if(State.user && !State.user.isAnonymous){
    chip.classList.remove('hidden');
    $('#logoutBtn').classList.remove('hidden');
    nm.textContent = State.user.email?.split('@')[0] || 'User';
    av.textContent = initials(nm.textContent);
  } else {
    chip.classList.add('hidden');
    $('#logoutBtn').classList.add('hidden');
  }
}

/* ======================= ROUTER ======================= */
const Router = {
  refresh(){
    const r = State.route;
    if(r==='home') renderHome();
    else if(r==='subjects') renderSubjects();
    else if(r==='chapters') renderChapters();
    else if(r==='chapter') renderChapter();
    else if(r==='dashboard') renderDashboard();
    else if(r==='admin') renderAdmin();
    else if(r==='auth') renderAuth();
  }
};

function afterLogin(){
  updateUserChip();
  if(State.profile?.classId){
    State.currentClass = (State.classes.find(c=>c.id===State.profile.classId)) || null;
  }
  if(State.isAdmin) renderAdmin();
  else renderDashboard();
}

/* ======================= INIT ======================= */
async function init(){
  wireHeader();
  wireChat();
  try{
    State.classes = await DataService.getClasses();
    if(!State.classes.length) State.classes = CLASSES_SEED;
  }catch(e){
    console.warn('classes load failed', e);
    State.classes = CLASSES_SEED;
  }
  await AuthService.bootstrap();
  updateUserChip();
  // Load AI key (once)
  try{ await AIService.loadKey(); }catch(e){ console.warn('key load failed', e); }
  if(State.profile) afterLogin();
  else if(State.user && !State.user.isAnonymous) afterLogin();
  else renderAuth();
  setTimeout(()=> $('#loader').classList.add('done'), 400);
}

init().catch(err=>{
  console.error('Init failed', err);
  toast('Failed to load. Check connection.', 'error', 6000);
  setTimeout(()=> $('#loader').classList.add('done'), 600);
});
